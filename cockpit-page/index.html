<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Maintenance</title>
    <link rel="stylesheet" href="style.css">
    <script src="../base1/cockpit.js"></script>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1>System Maintenance</h1>
            <div class="actions">
                <button id="btn-refresh" class="btn btn-secondary">Refresh</button>
                <button id="btn-run" class="btn btn-primary">Run Now</button>
            </div>
        </header>

        <div id="banner" class="banner" hidden></div>

        <section class="cards">
            <div class="card">
                <h3>Last Run</h3>
                <div id="last-run" class="value">—</div>
            </div>
            <div class="card">
                <h3>Last Exit Code</h3>
                <div id="last-exit" class="value">—</div>
            </div>
            <div class="card">
                <h3>Next Scheduled Run</h3>
                <div id="next-run" class="value">—</div>
            </div>
        </section>

        <section class="card">
            <h3>journald Caps</h3>
            <table class="caps-table">
                <tbody>
                    <tr><td>SystemMaxUse</td><td id="jc-max-use">—</td></tr>
                    <tr><td>SystemKeepFree</td><td id="jc-keep-free">—</td></tr>
                    <tr><td>MaxFileSec</td><td id="jc-max-file-sec">—</td></tr>
                </tbody>
            </table>
        </section>

        <section class="card log-card">
            <h3>Recent Log Output <span id="log-meta" class="meta"></span></h3>
            <pre id="log-output">Loading…</pre>
        </section>
    </div>

    <script src="index.js"></script>
</body>
</html>
